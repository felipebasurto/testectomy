name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y ripgrep; else brew install ripgrep; fi
      - run: python -m unittest discover -s tests -v
      - name: Example suites (before and after)
        run: |
          pip install pytest
          cd examples/tinyshop/before && python -m pytest -q
          cd ../after && python -m pytest -q
