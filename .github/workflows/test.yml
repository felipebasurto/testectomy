name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Example suites (before and after)
        run: |
          pip install pytest
          cd examples/tinyshop/before && python -m pytest -q
          cd ../after && python -m pytest -q
