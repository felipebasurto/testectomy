<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">testectomy logo: a list of tests cut along a dashed line, one kept</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="1" stop-color="#e5364f"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3e0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#tile)"/>

  <!-- Cut-away rows: faded, struck through -->
  <g fill="#ffffff" fill-opacity=".28">
    <rect x="104" y="118" width="304" height="44" rx="22"/>
    <rect x="104" y="350" width="304" height="44" rx="22"/>
  </g>
  <g stroke="#ffffff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round">
    <path d="M128 140H384"/>
    <path d="M128 372H384"/>
  </g>

  <!-- The kept test -->
  <rect x="88" y="208" width="336" height="96" rx="48" fill="#b3182f" fill-opacity=".28" transform="translate(0 8)"/>
  <rect x="88" y="208" width="336" height="96" rx="48" fill="url(#row)"/>
  <circle cx="148" cy="256" r="26" fill="#e5364f"/>
  <path d="M136 257L145 266L162 247" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="192" y="244" width="184" height="24" rx="12" fill="#e5364f" fill-opacity=".22"/>

  <!-- Incision lines above and below the kept row -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18">
    <path d="M60 186H452"/>
    <path d="M60 328H452"/>
  </g>
</svg>
